test:
  name: All-6-Experiments-10-Workers
  description: Complete paper experiments with 10 workers
  workers:
    number: 10
  rounds:
    # ========================================
    # EXPERIMENT 1: Worker Variation (5 vs 10)
    # ========================================
    - label: exp1-create-10workers-75tps
      description: Experiment 1 - CreateRecord 10 workers 75 TPS
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 75
      workload:
        module: workload/createRecord.js

    - label: exp1-read-10workers-75tps
      description: Experiment 1 - ReadRecord 10 workers 75 TPS
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 75
      workload:
        module: workload/readRecord.js
      arguments:
        maxRecords: 200

    # ========================================
    # EXPERIMENT 2: Transaction Volume Variation
    # ========================================
    - label: exp2-create-1000tx-75tps
      description: Experiment 2 - CreateRecord 1000 transactions
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 75
      workload:
        module: workload/createRecord.js

    - label: exp2-create-5000tx-75tps
      description: Experiment 2 - CreateRecord 5000 transactions
      txNumber: 5000
      rateControl:
        type: fixed-rate
        opts:
          tps: 75
      workload:
        module: workload/createRecord.js

    - label: exp2-create-15000tx-75tps
      description: Experiment 2 - CreateRecord 15000 transactions
      txNumber: 15000
      rateControl:
        type: fixed-rate
        opts:
          tps: 75
      workload:
        module: workload/createRecord.js

    - label: exp2-read-1000tx-75tps
      description: Experiment 2 - ReadRecord 1000 transactions
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 75
      workload:
        module: workload/readRecord.js
      arguments:
        maxRecords: 3000

    - label: exp2-read-5000tx-75tps
