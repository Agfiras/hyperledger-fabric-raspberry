      description: Experiment 4 - CreateRecord 10 workers linear 25-75 TPS
      txNumber: 1000
      rateControl:
        type: linear-rate
        opts:
          startingTps: 25
          finishingTps: 75
      workload:
        module: workload/createRecord.js

    - label: exp4-read-10workers-linear
      description: Experiment 4 - ReadRecord 10 workers linear 25-75 TPS
