name: fabric-network
version: 1.0.0

client:
  organization: Org1MSP
  connection:
    timeout:
      peer:
        endorser: '600'
      orderer: '600'
  eventHandlerOptions:
    commitTimeout: 300
    strategy: PREFER_MSPID_SCOPE_ANYFORTX

organizations:
  Org1MSP:
    mspid: Org1MSP
    peers:
      - peer0.org1.example.com
  Org2MSP:
    mspid: Org2MSP
    peers:
      - peer0.org2.example.com
  Org3MSP:
    mspid: Org3MSP
    peers:
      - peer0.org3.example.com

orderers:
  orderer1.example.com:
    url: grpcs://100.89.132.94:7050
    tlsCACerts:
      path: crypto-config/ordererOrganizations/example.com/orderers/orderer1.example.com/tls/ca.crt
    grpcOptions:
      ssl-target-name-override: orderer1.example.com
      grpc.keepalive_time_ms: 600000

peers:
  peer0.org1.example.com:
    url: grpcs://100.89.132.94:7051
    tlsCACerts:
      path: crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt
    grpcOptions:
      ssl-target-name-override: peer0.org1.example.com
      grpc.keepalive_time_ms: 600000
  peer0.org2.example.com:
    url: grpcs://100.81.64.92:8051
    tlsCACerts:
      path: crypto-config/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/ca.crt
    grpcOptions:
      ssl-target-name-override: peer0.org2.example.com
      grpc.keepalive_time_ms: 600000
  peer0.org3.example.com:
    url: grpcs://100.103.132.8:9051
    tlsCACerts:
      path: crypto-config/peerOrganizations/org3.example.com/peers/peer0.org3.example.com/tls/ca.crt
    grpcOptions:
      ssl-target-name-override: peer0.org3.example.com
      grpc.keepalive_time_ms: 600000
channels:
  mychannel:
    orderers:
      - orderer1.example.com
    peers:
      peer0.org1.example.com:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true
      peer0.org2.example.com:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true
      peer0.org3.example.com:
        endorsingPeer: false
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true